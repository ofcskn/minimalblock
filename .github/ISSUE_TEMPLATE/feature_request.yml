name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe the problem you are trying to solve — not just the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected and how often?
      placeholder: |
        As a merchant selling clothing on Trendyol, I frequently upload product photos with multiple items in the same shot. The current system tries to generate one 3D model from the entire scene, which produces poor results...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or features you have considered.

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - "3D generation / AI"
        - "Product import"
        - "Hotspot editing"
        - "Brand placement"
        - "Analytics / events"
        - "Authentication / accounts"
        - "Embed / sharing"
        - "Marketplace integration"
        - "Developer API"
        - "Documentation"
        - "Performance"
        - "CI / tooling"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - "Nice to have"
        - "Would significantly improve my workflow"
        - "Blocking — I cannot use the product without this"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, links, or any other context that helps explain the feature.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I checked the ROADMAP.md to see if this is already planned
          required: true
